name: Quality Metrics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Frontend/nimrag-frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create backend virtual environment
        run: python -m venv Backend/venv_py312

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          Backend/venv_py312/bin/python -m pip install --upgrade pip
          Backend/venv_py312/bin/python -m pip install -r Backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: Frontend/nimrag-frontend
        run: npm ci

      - name: Run quality pipeline
        run: npm run quality

      - name: Run cautious quality gates
        run: npm run quality:gates

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics
          path: reports/quality